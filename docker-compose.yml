services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilot
      POSTGRES_DB: careerpilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://careerpilot:careerpilot@db:5432/careerpilot
      LLM_THINKING_BUDGET: "0"
      LLM_CACHE_PATH: /data/llm_cache.json
    ports:
      - "8001:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - llm_cache:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache:
  llm_cache: